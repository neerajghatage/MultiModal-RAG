apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: session-store
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
