apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-system
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ""   # rag-api-identity
    keyvaultName: "kv-rag-system"
    tenantId: ""
    objects: |
      array:
        - |
          objectName: AZURE-OPENAI-API-KEY
          objectType: secret
          objectAlias: AZURE_OPENAI_API_KEY
        - |
          objectName: AZURE-BLOB-CONNECTION-STRING
          objectType: secret
          objectAlias: AZURE_BLOB_CONNECTION_STRING
        - |
          objectName: AZURE-AD-CLIENT-ID
          objectType: secret
          objectAlias: AZURE_AD_CLIENT_ID
        - |
          objectName: AZURE-AD-TENANT-ID
          objectType: secret
          objectAlias: AZURE_AD_TENANT_ID
        - |
          objectName: AZURE-AD-ALLOWED-GROUP-ID
          objectType: secret
          objectAlias: AZURE_AD_ALLOWED_GROUP_ID
        - |
          objectName: AZURE-OPENAI-ENDPOINT
          objectType: secret
          objectAlias: AZURE_OPENAI_ENDPOINT
        - |
          objectName: AZURE-AD-ALLOWED-DOMAIN
          objectType: secret
          objectAlias: AZURE_AD_ALLOWED_DOMAIN
  # Sync secrets to a K8s Secret so they can be used as env vars
  secretObjects:
    - secretName: rag-system-kv-secrets
      type: Opaque
      data:
        - objectName: AZURE_OPENAI_API_KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: AZURE_BLOB_CONNECTION_STRING
          key: AZURE_BLOB_CONNECTION_STRING
        - objectName: AZURE_AD_CLIENT_ID
          key: AZURE_AD_CLIENT_ID
        - objectName: AZURE_AD_TENANT_ID
          key: AZURE_AD_TENANT_ID
        - objectName: AZURE_AD_ALLOWED_GROUP_ID
          key: AZURE_AD_ALLOWED_GROUP_ID
        - objectName: AZURE_OPENAI_ENDPOINT
          key: AZURE_OPENAI_ENDPOINT
        - objectName: AZURE_AD_ALLOWED_DOMAIN
          key: AZURE_AD_ALLOWED_DOMAIN
