apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-allow-only-rag-api
  namespace: rag-system
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: rag-system
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-api
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
