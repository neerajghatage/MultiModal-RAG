apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag-system
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: rag-system
spec:
  selector:
    app: qdrant
  ports:
    - name: rest
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
  type: ClusterIP
